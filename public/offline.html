<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - InvoiceGE</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            opacity: 0.9;
        }
        .icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
        button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1.1em;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>You're Offline</h1>
        <p>
            No internet connection detected. Your invoices are saved locally and will sync when you're back online.
        </p>
        <p>
            <strong>You can still:</strong><br>
            ✓ View previously loaded invoices<br>
            ✓ Create new invoices offline<br>
            ✓ Export invoices as PDF
        </p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
